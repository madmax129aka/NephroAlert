# Application
spring.application.name=NephroAlert
server.port=5000

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nephroalert?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=nephroalert_secret_2024_springboot_very_secure_key_minimum_256_bits
app.jwt.expiration-ms=604800000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.nephroalert=INFO
logging.level.org.springframework.security=WARN
